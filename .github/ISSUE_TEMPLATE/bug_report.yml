name: Bug report
description: Report a reproducible problem with the runtime, a client or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please remove credentials, private prompts and personal paths from any logs."
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, BetterChat commit/version, client and client version.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal command or fixture and whether it uses a real model.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant errors and check results. Do not upload your full .nexo directory.
