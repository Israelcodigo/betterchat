      <rect x="758" y="152" width="122" height="56" rx="12"/>
      <rect x="758" y="244" width="122" height="56" rx="12"/>
    </g>
    <g fill="#d8e8ef" font-size="15" text-anchor="middle">
      <text x="819" y="94">BUILD</text><text x="819" y="186">REVIEW</text><text x="819" y="278">VERIFY</text>
    </g>
    <rect x="996" y="128" width="104" height="104" rx="25" fill="#183f43" stroke="#61cfb9" stroke-width="2"/>
    <path d="m1022 180 18 18 34-37" fill="none" stroke="#91f1d8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1180" cy="180" r="8" fill="#91f1d8"/>
    <text x="1048" y="265" text-anchor="middle" font-size="12" letter-spacing="2" fill="#a9c5d1">EVIDENCE</text>
