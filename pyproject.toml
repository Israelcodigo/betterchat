[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-agent-kit"
version = "1.3.0rc1"
description = "Evidence-driven multi-provider coding-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://github.com/Israelcodigo/betterchat"
Repository = "https://github.com/Israelcodigo/betterchat"
Issues = "https://github.com/Israelcodigo/betterchat/issues"

[project.scripts]
nexo = "nexo_kit.cli:main"

[tool.setuptools.packages.find]
include = ["nexo_kit*"]

[tool.setuptools.package-data]
nexo_kit = ["assets/**/*"]
